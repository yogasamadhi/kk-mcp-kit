# Bun runtime variant. The .mjs files are identical to the Node configuration.

[mcp_servers.kk-workspace]
command = "bun"
args = ["/ABSOLUTE/PATH/TO/kk-mcp-kit/servers/workspace/dist/cli.mjs", "--config", "/ABSOLUTE/PATH/TO/kk-mcp.config.json"]

