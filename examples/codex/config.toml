# Copy these entries into Codex config.toml and replace both absolute path placeholders.
# Every server receives the same explicit config file but starts as an independent STDIO process.

[mcp_servers.kk-workspace]
command = "node"
args = ["/ABSOLUTE/PATH/TO/kk-mcp-kit/servers/workspace/dist/cli.mjs", "--config", "/ABSOLUTE/PATH/TO/kk-mcp.config.json"]

[mcp_servers.kk-git-guardian]
command = "node"
args = ["/ABSOLUTE/PATH/TO/kk-mcp-kit/servers/git-guardian/dist/cli.mjs", "--config", "/ABSOLUTE/PATH/TO/kk-mcp.config.json"]

